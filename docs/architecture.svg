<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">FESTIVA architecture</title>
  <desc id="d">The browser talks to one Next.js server. Route handlers validate, rate-limit and check flags before calling the framework-free domain layer and the curated data. Optional external services: Sarvam AI, Flagsmith, NudgeBee, Supabase and an AI provider.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#574f5c"/></marker>
    <style>
      .zone{fill:#fbf6ea;stroke:#b9995e;stroke-width:1.5}
      .box{fill:#fff;stroke:#574f5c;stroke-width:1.2}
      .ext{fill:#fff;stroke:#0e5a48;stroke-width:1.6}
      .h{font-size:20px;font-weight:700;fill:#33143a}
      .b{font-size:15px;font-weight:650;fill:#241f27}
      .s{font-size:12.5px;fill:#574f5c}
      .l{font-size:12px;fill:#9a5005}
      .ln{stroke:#574f5c;stroke-width:1.4;fill:none;marker-end:url(#a)}
      .opt{stroke:#0e5a48;stroke-width:1.4;fill:none;stroke-dasharray:6 4;marker-end:url(#a)}
    </style>
  </defs>
  <rect width="1200" height="720" fill="#ffffff"/>

  <!-- Browser -->
  <rect class="zone" x="20" y="60" width="250" height="600" rx="14"/>
  <text class="h" x="40" y="95">Browser</text>
  <rect class="box" x="40" y="115" width="210" height="250" rx="10"/>
  <text class="b" x="55" y="142">11 modules</text>
  <text class="s" x="55" y="166">Discover · Journeys</text>
  <text class="s" x="55" y="186">Taste · Wear · Shop</text>
  <text class="s" x="55" y="206">Wishes · Play · Sound</text>
  <text class="s" x="55" y="226">Intelligence</text>
  <text class="s" x="55" y="246">Matchmaker</text>
  <text class="s" x="55" y="266">Gift Circle</text>
  <text class="s" x="55" y="296">Festival → plan → circle</text>
  <text class="s" x="55" y="316">links, validated on read</text>
  <text class="s" x="55" y="346">WebGL globe, 2D fallback</text>
  <rect class="box" x="40" y="390" width="210" height="110" rx="10"/>
  <text class="b" x="55" y="417">localStorage</text>
  <text class="s" x="55" y="441">saved items and plans</text>
  <text class="s" x="55" y="461">circle keys (Bearer)</text>
  <text class="s" x="55" y="481">anonymous id for flags</text>
  <rect class="box" x="40" y="525" width="210" height="115" rx="10"/>
  <text class="b" x="55" y="552">/admin</text>
  <text class="s" x="55" y="576">token → signed session</text>
  <text class="s" x="55" y="596">integrations · operations</text>
  <text class="s" x="55" y="616">approvals · audit trail</text>

  <!-- Server -->
  <rect class="zone" x="320" y="60" width="520" height="600" rx="14"/>
  <text class="h" x="340" y="95">Next.js 16 server</text>
  <rect class="box" x="340" y="115" width="480" height="90" rx="10"/>
  <text class="b" x="355" y="142">Route handlers and guards</text>
  <text class="s" x="355" y="166">Zod validation · body caps · rate limits (spoof-resistant)</text>
  <text class="s" x="355" y="186">hashed circle keys · admin HMAC session · requireFlag()</text>

  <rect class="box" x="340" y="225" width="230" height="160" rx="10"/>
  <text class="b" x="355" y="252">src/domain</text>
  <text class="s" x="355" y="276">pure TypeScript</text>
  <text class="s" x="355" y="296">Matchmaker engine</text>
  <text class="s" x="355" y="316">budget (exact minor units)</text>
  <text class="s" x="355" y="336">dates · circle engine</text>
  <text class="s" x="355" y="356">structuring · games</text>

  <rect class="box" x="590" y="225" width="230" height="160" rx="10"/>
  <text class="b" x="605" y="252">src/data</text>
  <text class="s" x="605" y="276">46 festivals · 40 countries</text>
  <text class="s" x="605" y="296">original names, symbols</text>
  <text class="s" x="605" y="316">calendar systems</text>
  <text class="s" x="605" y="336">sources, date status</text>
  <text class="s" x="605" y="356">expert reviews: none yet</text>

  <rect class="box" x="340" y="405" width="230" height="110" rx="10"/>
  <text class="b" x="355" y="432">Provider receipts</text>
  <text class="s" x="355" y="456">HMAC over Sarvam output</text>
  <text class="s" x="355" y="476">verified before saving</text>
  <text class="s" x="355" y="496">"by Sarvam" cannot be forged</text>

  <rect class="box" x="590" y="405" width="230" height="110" rx="10"/>
  <text class="b" x="605" y="432">Operations</text>
  <text class="s" x="605" y="456">metrics · 5 alert rules</text>
  <text class="s" x="605" y="476">runbooks run only after</text>
  <text class="s" x="605" y="496">a human approves</text>

  <rect class="box" x="340" y="535" width="480" height="105" rx="10"/>
  <text class="b" x="355" y="562">Circle store</text>
  <text class="s" x="355" y="586">file store in FESTIVA_DATA_DIR (default, one server)</text>
  <text class="s" x="355" y="606">or Supabase gift_circles (RLS on, no client policies)</text>
  <text class="s" x="355" y="626">service-role key used only on the server</text>

  <!-- External -->
  <rect class="zone" x="890" y="60" width="290" height="600" rx="14"/>
  <text class="h" x="910" y="95">External, all optional</text>
  <rect class="ext" x="910" y="115" width="250" height="90" rx="10"/>
  <text class="b" x="925" y="142">Sarvam AI</text>
  <text class="s" x="925" y="166">saaras:v4 speech to text</text>
  <text class="s" x="925" y="186">sarvam-translate:v1 · sarvam-105b</text>
  <rect class="ext" x="910" y="225" width="250" height="90" rx="10"/>
  <text class="b" x="925" y="252">Flagsmith</text>
  <text class="s" x="925" y="276">10 flags · remote config</text>
  <text class="s" x="925" y="296">onboarding A/B experiment</text>
  <rect class="ext" x="910" y="335" width="250" height="90" rx="10"/>
  <text class="b" x="925" y="362">NudgeBee</text>
  <text class="s" x="925" y="386">Event Webhook (alerts in)</text>
  <text class="s" x="925" y="406">GraphQL read-back</text>
  <rect class="ext" x="910" y="445" width="250" height="90" rx="10"/>
  <text class="b" x="925" y="472">Supabase</text>
  <text class="s" x="925" y="496">Postgres + Row Level Security</text>
  <text class="s" x="925" y="516">Auth · plans · share links</text>
  <rect class="ext" x="910" y="555" width="250" height="85" rx="10"/>
  <text class="b" x="925" y="582">Anthropic or OpenAI</text>
  <text class="s" x="925" y="606">Intelligence answers only;</text>
  <text class="s" x="925" y="626">never writes plan items</text>

  <!-- Arrows -->
  <path class="ln" d="M270 160 H338"/>
  <text class="l" x="278" y="152">HTTPS</text>
  <path class="ln" d="M580 205 V223"/>
  <path class="ln" d="M570 305 H588"/>
  <path class="ln" d="M455 205 V223"/>
  <path class="ln" d="M705 515 V533"/>
  <path class="ln" d="M455 515 V533"/>
  <path class="opt" d="M820 128 C865 128 865 150 908 150"/>
  <path class="opt" d="M820 160 C860 160 860 270 908 270"/>
  <path class="opt" d="M820 470 C860 470 860 380 908 380"/>
  <path class="opt" d="M820 590 C860 590 860 490 908 490"/>
  <path class="opt" d="M820 190 C870 190 870 597 908 597"/>
  <text class="l" x="20" y="700">Solid: always present. Dashed: only when its credentials are configured. With none, FESTIVA runs in demo mode and each service shows "Not configured".</text>
  <text class="h" x="20" y="38">FESTIVA 1.2.0 architecture</text>
</svg>
